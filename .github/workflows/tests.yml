# Runs the test suites and scans on GitHub, so the Reviewer (and anyone) can read an independent result:
# Actions -> Tests -> the run for a commit. It builds nothing and publishes nothing.
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# (no concurrency group: every checkpoint commit gets its own run and result, R20)

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the app's packages (over Debian's own copies)
        run: sudo pip install -q --break-system-packages --ignore-installed -r requirements.txt pypdf
      - name: Set up the test machine (Postgres on 55432, packages, Chromium, faketime)
        run: sudo bash tests/tools/setup.sh
      - name: Test the test runner itself (injected failures)
        run: bash tests/tools/harness_selftest.sh
      - name: Run every suite (tests/run.sh)
        working-directory: tests
        env:
          TEST_DB_PORT: "55432"
        shell: bash   # (with pipefail, so a failing run fails the step)
        run: sudo TEST_DB_PORT=55432 bash run.sh | tee "$GITHUB_STEP_SUMMARY"
      - name: Scans (pip-audit, bandit)
        run: |
          pip install --break-system-packages pip-audit bandit
          pip-audit -r requirements.txt
          bandit -r app -q || true   # findings are read in the log, as in a REVIEW (not a gate)
