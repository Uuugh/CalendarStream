# Releases for CalendarStream. Versions are x.y.z-beta.N (a beta) or x.y.z (a stable release).
#  - VERSION changes on main  -> git tag v<VERSION>, move "beta", build and push
#                                ghcr.io/<owner>/calendarstream:<VERSION> and :beta,
#                                GitHub Release (pre-release) with the version's CHANGELOG notes
#  - STABLE changes on main   -> mark that version stable: point the "latest" image at it and make
#                                its GitHub Release the latest, non-pre-release one
#                                (no "latest" git tag: GitHub won't let the workflow token create one
#                                on an older commit, and the server uses the image, not a checkout)
#  - Run manually (Actions -> Release -> Run workflow) with a version -> same as a STABLE change
#  Deploy changes both in one push (VERSION and STABLE = x.y.z, the last beta without its suffix):
#  the version is built first, then marked latest.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, STABLE, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      stable_version:
        description: "Version to mark as stable / latest (x.y.z, e.g. 0.2.7)"
        required: true

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.d.outputs.version }}
      version_changed: ${{ steps.d.outputs.version_changed }}
      stable: ${{ steps.d.outputs.stable }}
      stable_changed: ${{ steps.d.outputs.stable_changed }}
      image: ${{ steps.d.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_STABLE: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          # VERSION is x.y.z or x.y.z-beta.N; STABLE (latest) is only ever x.y.z.
          check_version() { [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "'$1' is not x.y.z or x.y.z-beta.N"; exit 1; }; }
          check() { [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "'$1' is not x.y.z (a beta can't be latest)"; exit 1; }; }
          VERSION="$(tr -d '[:space:]' < VERSION)"; check_version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A fixed image name (not taken from the repository name), so renaming the repository
          # doesn't change it. (Up to 0.1.0 it was called calendar_stream; all of those versions
          # were copied here, and that old package has been removed.)
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/calendarstream" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            STABLE="${INPUT_STABLE#v}"; check "$STABLE"
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            echo "stable=$STABLE" >> "$GITHUB_OUTPUT"; echo "stable_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          else
            CHANGED="$(git ls-files)"
          fi
          echo "$CHANGED" | grep -qx 'VERSION' && echo "version_changed=true" >> "$GITHUB_OUTPUT" || echo "version_changed=false" >> "$GITHUB_OUTPUT"
          if [ -f STABLE ] && echo "$CHANGED" | grep -qxE 'STABLE|\.github/workflows/release\.yml'; then
            STABLE="$(tr -d '[:space:]' < STABLE)"; check "$STABLE"
            echo "stable=$STABLE" >> "$GITHUB_OUTPUT"; echo "stable_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # A new VERSION: tag it, move "beta", build and push the image, publish a pre-release.
  beta:
    needs: detect
    if: needs.detect.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tags and the GitHub Release
      packages: write   # the image
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      IMAGE: ${{ needs.detect.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag v<VERSION> and move beta
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists; leaving it."
          else
            git tag -a "v$VERSION" -m "CalendarStream $VERSION"
            git push origin "refs/tags/v$VERSION"
          fi
          git tag -f beta "v$VERSION^{commit}"
          git push -f origin refs/tags/beta

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:beta
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release (pre-release) with the CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk -v h="## $VERSION " 'index($0,h)==1{p=1;next} /^## /{p=0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --verify-tag --title "CalendarStream $VERSION" \
              --notes-file notes.md --prerelease
          fi
          echo "Released **$VERSION** (beta): \`$IMAGE:$VERSION\`, \`:beta\`" >> "$GITHUB_STEP_SUMMARY"

  latest:
    needs: [detect, beta]
    # Runs after beta when both files changed in one push; beta being skipped is fine.
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.stable_changed == 'true' && needs.beta.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub Release
      packages: write   # the "latest" image tag
    env:
      STABLE: ${{ needs.detect.outputs.stable }}
      IMAGE: ${{ needs.detect.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Check the version's tag and image exist
        run: |
          set -uo pipefail
          git fetch --tags --force 2>&1 || { echo "::error::git fetch --tags failed"; exit 1; }
          git rev-parse -q --verify "refs/tags/v$STABLE" >/dev/null \
            || { echo "::error::Tag v$STABLE doesn't exist"; exit 1; }
          if ! out=$(docker buildx imagetools inspect "$IMAGE:$STABLE" 2>&1); then
            echo "::error::Image $IMAGE:$STABLE not found: $(echo "$out" | tail -3 | tr '\n' ' ')"; exit 1
          fi
      - name: Point the latest image at the version
        run: |
          set -uo pipefail
          if ! out=$(docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$STABLE" 2>&1); then
            echo "::error::imagetools create failed: $(echo "$out" | tail -3 | tr '\n' ' ')"; exit 1
          fi
      - name: Make its GitHub Release the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          awk -v h="## $STABLE " 'index($0,h)==1{p=1;next} /^## /{p=0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if gh release view "v$STABLE" >/dev/null 2>&1; then
            out=$(gh release edit "v$STABLE" --notes-file notes.md --prerelease=false --latest 2>&1)
          else
            out=$(gh release create "v$STABLE" --verify-tag --title "CalendarStream $STABLE" --notes-file notes.md --latest 2>&1)
          fi || { echo "::error::GitHub Release failed: $(echo "$out" | tail -3 | tr '\n' ' ')"; exit 1; }
          echo "latest -> **$STABLE** (image and GitHub Release)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Releases for older versions that don't have one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for tag in $(git tag -l 'v*.*.*' --sort=version:refname); do
            v="${tag#v}"
            gh release view "$tag" >/dev/null 2>&1 && continue
            awk -v h="## $v " 'index($0,h)==1{p=1;next} /^## /{p=0} p' CHANGELOG.md > notes.md
            [ -s notes.md ] || continue
            gh release create "$tag" --verify-tag --title "CalendarStream $v" --notes-file notes.md \
              --prerelease --latest=false || echo "::warning::Couldn't create a release for $tag"
          done
