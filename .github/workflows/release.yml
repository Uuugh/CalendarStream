# Releases for Calendar Stream
#  - Push to main that changes VERSION -> git tag v<VERSION>, moves git tag "beta",
#    builds the image and pushes ghcr.io/<owner>/calendar_stream:<VERSION> and :beta
#  - Run manually (Actions -> Release -> Run workflow) with a version -> marks it stable:
#    moves git tag "latest" and points ghcr.io/<owner>/calendar_stream:latest at that version
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      stable_version:
        description: "Version to mark as stable / latest (e.g. 0.0.3)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  beta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION '$VERSION' is not x.y.z"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tag v<VERSION> and move beta
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists; leaving it."
          else
            git tag -a "v$VERSION" -m "Calendar Stream $VERSION"
            git push origin "refs/tags/v$VERSION"
          fi
          git tag -f beta "v$VERSION^{commit}"
          git push -f origin refs/tags/beta

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:beta
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Released **${{ steps.v.outputs.version }}** (beta)" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}\` and \`:beta\`" >> "$GITHUB_STEP_SUMMARY"

  latest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Mark version stable (latest)
        env:
          STABLE: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          STABLE="${STABLE#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/v$STABLE" >/dev/null || { echo "Tag v$STABLE doesn't exist"; exit 1; }
          docker buildx imagetools inspect "$IMAGE:$STABLE" >/dev/null || { echo "Image $IMAGE:$STABLE doesn't exist"; exit 1; }
          git tag -f latest "v$STABLE^{commit}"
          git push -f origin refs/tags/latest
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$STABLE"
          echo "latest -> **$STABLE** (git tag and image)" >> "$GITHUB_STEP_SUMMARY"
