# Release tags for Calendar Stream
#  - Push to main that changes VERSION  -> creates tag v<VERSION> and moves "beta" to it
#  - Run manually (Actions -> Release tags -> Run workflow) with a version -> moves "latest" to it
name: Release tags

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release-tags.yml]
  workflow_dispatch:
    inputs:
      stable_version:
        description: "Version to mark as stable / latest (e.g. 0.0.3)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  beta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag v<VERSION> and move beta
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION '$VERSION' is not x.y.z"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists at $(git rev-list -n1 "v$VERSION"); leaving it."
          else
            git tag -a "v$VERSION" -m "Calendar Stream $VERSION"
            git push origin "refs/tags/v$VERSION"
          fi
          git tag -f beta "v$VERSION^{commit}"
          git push -f origin refs/tags/beta
          echo "beta -> v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  latest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move latest to the stable version
        env:
          STABLE: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          STABLE="${STABLE#v}"
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/v$STABLE" >/dev/null || { echo "Tag v$STABLE doesn't exist"; exit 1; }
          git tag -f latest "v$STABLE^{commit}"
          git push -f origin refs/tags/latest
          echo "latest -> v$STABLE" >> "$GITHUB_STEP_SUMMARY"
