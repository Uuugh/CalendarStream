name: Suggest a feature
description: An idea that would make CalendarStream more useful.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like CalendarStream to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help? (optional)
      description: The problem it solves, or how you'd use it.
  - type: textarea
    id: setup
    attributes:
      label: Setup (optional)
      description: Filled in by the status page's form when ticked.
      render: text
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: Shown publicly. GitHub notifies you of replies to your own issue.
