# CalendarStream: the app and its Postgres database.
# Needs .env (only MNT_DOCKER is required) and $MNT_DOCKER/.secrets/DB_PASSWORD.txt (see the end).
# Logins (CCS+ and the status page) are set on the status page.
services:
  calendar_stream:
    # Built by GitHub Actions from https://github.com/Uuugh/CalendarStream
    # IMAGE_TAG: latest (stable), beta (newest) or an exact version such as 0.1.2
    image: ghcr.io/uuugh/calendarstream:${IMAGE_TAG:-latest}
    # Check for a newer image on every "up", so the moving tags (latest, beta) update
    pull_policy: always
    container_name: calendar_stream
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${GUID:-100}
      - TZ=${TZ:-America/Chicago}
      # All project data is stored in the database container below
      - DB_HOST=calendar_stream_db
      - DB_NAME=${DB_NAME:-calendar_stream}
      - DB_USER=${DB_USER:-ccs}
      - DB_PASSWORD_FILE=/run/secrets/DB_PASSWORD
    secrets:
      - DB_PASSWORD
    depends_on:
      calendar_stream_db:
        condition: service_healthy
    restart: ${RESTART:-unless-stopped}

  calendar_stream_db:
    image: postgres:18-alpine
    container_name: calendar_stream_db
    environment:
      - POSTGRES_DB=${DB_NAME:-calendar_stream}
      - POSTGRES_USER=${DB_USER:-ccs}
      - POSTGRES_PASSWORD_FILE=/run/secrets/DB_PASSWORD
      - TZ=${TZ:-America/Chicago}
    volumes:
      - ${MNT_DOCKER:?Set MNT_DOCKER in .env}/calendar_stream/postgres:/var/lib/postgresql
    secrets:
      - DB_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: ${RESTART:-unless-stopped}

# The database password: one line, chosen by you (a trailing newline is fine). It's set when the
# database is first created, and also protects the passwords CalendarStream stores.
secrets:
  DB_PASSWORD:
    file: ${MNT_DOCKER:?Set MNT_DOCKER in .env}/.secrets/DB_PASSWORD.txt
